$kind: http-request
url: http://localhost:3000/api/pacientes/registro
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Paciente Prueba {{runId}}",
      "usuario": "pac_{{runId}}",
      "email": "pac_{{runId}}@medic.test",
      "telefono": "5587654321",
      "pass": "Test1234!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', function () { pm.response.to.have.status(201); });
      pm.test('success = true', function () { pm.expect(pm.response.json().success).to.be.true; });
    language: text/javascript
order: 1000
