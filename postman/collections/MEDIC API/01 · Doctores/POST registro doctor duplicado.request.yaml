$kind: http-request
url: "{{baseUrl}}/api/doctores/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Dr. Prueba {{runId}}",
      "usuario": "doc_{{runId}}",
      "email": "doc_{{runId}}@medic.test",
      "telefono": "5512345678",
      "cedula": "CED{{runId}}",
      "especialidad": "Cardiología",
      "pass": "Test1234!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () { pm.response.to.have.status(400); });
      pm.test('Mensaje: ya se encuentran registrados', function () { pm.expect(pm.response.json().message).to.include('ya se encuentran registrados'); });
    language: text/javascript
order: 2000
