$kind: http-request
url: "{{baseUrl}}/api/doctores/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identificador": "doc_{{runId}}@medic.test",
      "pass": "Test1234!"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
