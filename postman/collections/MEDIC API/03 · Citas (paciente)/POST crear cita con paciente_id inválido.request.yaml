$kind: http-request
url: http://localhost:3000/api/citas
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "paciente_id": "abc",
      "medico_id": "{{medico_id}}",
      "fecha": "{{fechaCita}}",
      "hora": "{{horaCita}}",
      "motivo_consulta": "Dolor de cabeza persistente (prueba Postman)"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 8000
