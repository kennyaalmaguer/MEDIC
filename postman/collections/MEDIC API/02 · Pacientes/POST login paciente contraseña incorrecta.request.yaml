$kind: http-request
url: http://localhost:3000/api/pacientes/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identificador": "pac_{{runId}}",
      "pass": "incorrecta"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', function () { pm.response.to.have.status(401); });
      pm.test('Mensaje: Contraseña incorrecta', function () { pm.expect(pm.response.json().message).to.include('Contraseña incorrecta'); });
    language: text/javascript
order: 5000
