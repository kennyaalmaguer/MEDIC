$kind: http-request
url: http://localhost:3000/api/citas/{{cita_id}}/finalizar
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "observaciones": "Segundo intento"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', function () { pm.response.to.have.status(409); });
      pm.test('Mensaje: ya fue finalizada', function () { pm.expect(pm.response.json().mensaje).to.include('ya fue finalizada'); });
    language: text/javascript
order: 6000
