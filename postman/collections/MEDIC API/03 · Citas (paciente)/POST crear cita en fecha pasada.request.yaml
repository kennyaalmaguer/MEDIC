$kind: http-request
url: http://localhost:3000/api/citas
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "paciente_id": "{{paciente_id}}",
      "medico_id": "{{medico_id}}",
      "fecha": "2020-01-01",
      "hora": "{{horaCita}}",
      "motivo_consulta": "Dolor de cabeza persistente (prueba Postman)"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () { pm.response.to.have.status(400); });
      pm.test('Mensaje: futuras', function () { pm.expect(pm.response.json().mensaje).to.include('futuras'); });
    language: text/javascript
order: 6000
