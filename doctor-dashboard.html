<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Dashboard Médico | MediPortal</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  
  <!-- Plugins Needed for the Project -->
  <link rel="stylesheet" href="plugins/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="plugins/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="plugins/animate.css">
  
  <!-- Stylesheet -->
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" href="images/favicon.png" type="image/x-icon">

  <style>
    /* Estilos del Dashboard */
    .doctor-header {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 15px 0;
    }
    .metric-card {
      background: #f4fbfb;
      border: 1px solid #48bdc5;
      border-radius: 8px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .metric-card .icon {
      font-size: 2rem;
      color: #48bdc5;
    }
    
    /* Time-Grid / Estructura del Día */
    .schedule-container {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    .time-slot {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
      min-height: 80px;
      position: relative;
      transition: background 0.2s;
    }
    .time-label {
      width: 90px;
      background: #fafafa;
      border-right: 1px solid #e0e0e0;
      padding: 15px 10px;
      font-weight: bold;
      color: #666;
      font-size: 0.9rem;
      text-align: center;
    }
    .slot-content {
      flex-grow: 1;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    /* Estados de Cita */
    .time-slot.past-slot {
      background-color: #f8f9fa;
      opacity: 0.6;
      pointer-events: none; /* Desactivación automática */
    }
    .time-slot.past-slot .badge-status {
      background-color: #6c757d;
      color: white;
    }
    .time-slot.active-slot {
      background-color: #ffffff;
    }
    .time-slot.selected-slot {
      background-color: #e8f7f8;
      border-left: 4px solid #48bdc5;
    }

    /* Layout Panel Dividido (Modo Consulta Activa) */
    .workspace-wrapper {
      transition: all 0.3s ease;
    }
    .consultation-panel {
      display: none; /* Se activa al seleccionar una cita */
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      position: sticky;
      top: 20px;
    }
    
    #medicoSelect {
      height: calc(1.5em + .5rem + 2px) !important;
      line-height: 1.5 !important;
      padding: .25rem 2rem .25rem .5rem !important;
      color: #495057 !important;
      background-color: #fff;
      font-weight: bold;
    }
    .patient-info-box {
      background: #f9f9f9;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body class="bg-gray">
<div class="page-wrapper">

  <!-- Encabezado del Doctor -->
  <header class="doctor-header shadow-sm mb-4">
    <div class="container-fluid px-4">
      <div class="row align-items-center">
        <div class="col-md-4 col-6">
          <div class="logo">
            <a href="index.html">
              <img loading="lazy" class="img-fluid" src="images/logo.png" alt="logo" style="max-height: 45px;">
            </a>
          </div>
        </div>
        <div class="col-md-8 col-6 text-right d-flex align-items-center justify-content-end">
          <div class="user-profile mr-3 text-right">
            <label for="medicoSelect" class="sr-only">Médico</label>
            <select id="medicoSelect" class="form-control form-control-sm" onchange="cambiarMedico()">
              <option value="">Cargando médicos...</option>
            </select>
            <small class="text-muted" id="medicoEspecialidad"></small>
          </div>
          <img src="images/team/1.jpg" alt="Doctor Avatar" class="rounded-circle mr-3" style="width: 40px; height: 40px; object-fit: cover;" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Crect width=%2240%22 height=%2240%22 fill=%22%2348bdc5%22/%3E%3C/svg%3E'">
          <a href="login.html" class="btn btn-sm btn-outline-danger" title="Cerrar Sesión"><i class="fas fa-sign-out-alt"></i></a>
        </div>
      </div>
    </div>
  </header>

  <div class="container-fluid px-4">
    
    <!-- Métrica Semanal y Control de Agenda Día -->
    <div class="row mb-4 align-items-center">
      
      <!-- Selector de Fecha / Día -->
      <div class="col-lg-7 col-md-6 mb-3 mb-md-0">
        <div class="d-flex align-items-center flex-wrap gap-2">
          <h3 class="mb-0 font-weight-bold mr-3">Agenda del Día</h3>
          <button class="btn btn-outline-secondary mr-2" type="button" onclick="cambiarDia(-1)" title="Día anterior"><i class="fas fa-chevron-left"></i></button>
          <div class="input-group" style="max-width: 280px;">
            <input type="date" class="form-control" id="agendaDate" onchange="cargarAgenda()">
            <div class="input-group-append">
              <button class="btn btn-style-one py-0 px-3" type="button" onclick="resetToday()"><i class="fas fa-calendar-day mr-1"></i> Hoy</button>
            </div>
          </div>
          <button class="btn btn-outline-secondary ml-2" type="button" onclick="cambiarDia(1)" title="Día siguiente"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>

      <!-- Métrica Semanal Superior -->
          <!-- <div class="col-lg-5 col-md-6">
        <div class="metric-card">
        <div>
         <span class="text-muted small text-uppercase font-weight-bold">Citas Completadas esta Semana</span>
            <h3 class="mb-0 text-dark font-weight-bold" id="weeklyCounter">28 <span class="small text-success" style="font-size: 0.9rem;"><i class="fas fa-arrow-up"></i> +4 hoy</span></h3>
          </div>
          <div class="icon"> 
            <i class="fas fa-user-check"></i>
          </div>
        </div>
      </div>-->

    </div>

    <!-- Workspace Principal (Soporta Vista Pantalla Entera y Split Screen) -->
    <div class="row workspace-wrapper">
      
      <!-- Columna Principal: Time-Grid / Calendario Diario -->
      <div class="col-lg-12" id="calendarColumn">
        <div class="schedule-container shadow-sm">
          
          <div class="p-3 bg-white border-bottom d-flex justify-content-between align-items-center">
            <span class="font-weight-bold text-muted" id="selectedDateTitle"><i class="far fa-calendar-alt mr-2"></i> Cargando...</span>
            <span class="badge badge-info px-3 py-2">Modo Consulta Activo</span>
          </div>

          <!-- Time Grid / Bloques Horarios -->
          <div class="time-grid-wrapper" id="timeGrid"></div>
        </div>
      </div>

      <!-- Panel Dividido: Sección Izquierda/Inferior (Modo Consulta Activa) -->
      <div class="col-lg-6" id="consultationColumn">
        <div class="consultation-panel" id="consultationPanel">
          
          <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h4 class="mb-0 font-weight-bold text-primary"><i class="fas fa-user-md mr-2"></i>Consulta en Curso</h4>
            <button type="button" class="close text-danger" onclick="closeConsultation()" aria-label="Cerrar">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>

          <!-- Información del Paciente (Sección Izquierda del Split) -->
          <div class="patient-info-box">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="font-weight-bold mb-1" id="patientName">Carlos Eduardo Mendoza</h5>
                <p class="text-muted mb-1 small" id="patientMeta">34 años | Expediente: EXP-8842</p>
              </div>
              <span class="badge badge-warning" id="patientEstado">En Atención</span>
            </div>
            <hr class="my-2">
            <div class="row small">
              <div class="col-6">
                <strong>Antecedentes:</strong>
                <p class="mb-0 text-muted" id="patientHistory">Hipertensión arterial</p>
              </div>
              <div class="col-6">
                <strong>Motivo Consulta:</strong>
                <p class="mb-0 text-muted" id="patientReason">Dolor torácico moderado.</p>
              </div>
            </div>
          </div>

          <!-- Nota Médica e Interacción (Sección Inferior/Derecha) -->
          <form onsubmit="finishConsultation(event)">
            <div class="form-group mb-2">
              <label class="font-weight-bold small"><i class="fas fa-edit mr-1"></i> Observaciones y Evolución Clínica</label>
              <textarea id="obsEvolucion" class="form-control" rows="4" maxlength="5000" placeholder="Escribe aquí los síntomas, hallazgos del examen físico y observaciones..." required></textarea>
            </div>

            <div class="form-group mb-3">
              <label class="font-weight-bold small"><i class="fas fa-prescription mr-1"></i> Prescripción / Plan Médico</label>
              <textarea id="prescripcion" class="form-control" rows="3" maxlength="3000" placeholder="Medicamentos, dosis, indicaciones y estudios a solicitar..."></textarea>
            </div>

            <div id="mensajeConsulta" role="status" class="mb-2"></div>

            <div class="d-flex gap-2">
              <button type="submit" id="btnFinalizar" class="btn btn-style-one w-100 mr-2"><i class="fas fa-check-circle mr-1"></i> Finalizar Consulta</button>
              <button type="button" class="btn btn-light border" onclick="closeConsultation()">Cancelar</button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>

  <!-- Footer Simplificado -->
  <footer class="footer-bottom mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 MediPortal. Todos los derechos reservados.</p>
    </div>
  </footer>

</div>

<script src="plugins/jquery.min.js"></script>
<script src="plugins/bootstrap/bootstrap.min.js"></script>

<script>
  const ZONA = 'America/Mexico_City';
  // Horarios que ofrece la agenda del paciente (formato 24 h)
  // MODO PRUEBA: true = se muestran las citas de TODOS los médicos como si fueran
  // para el mismo doctor. Cuando haya inicio de sesión, cambiar a false.
  const MOSTRAR_TODAS_LAS_CITAS = true;
  const HORAS_BASE = ['09:00', '10:00', '11:00', '13:00', '15:00', '16:00', '17:30'];

  let medicos = [];
  let medicoId = '';
  let citasDia = [];
  let citaActiva = null;
  let activeSlotId = null;
  let numeroCarga = 0;

  function esc(texto) {
    return String(texto == null ? '' : texto).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const mayus = t => t.charAt(0).toUpperCase() + t.slice(1);

  // Fecha de hoy en Ciudad de México (YYYY-MM-DD)
  function hoyMX() {
    return new Date().toLocaleDateString('en-CA', { timeZone: ZONA });
  }

  // '13:00' -> '01:00 PM'
  function hora12(hhmm) {
    const m = String(hhmm).match(/^(\d{1,2}):(\d{2})/);
    if (!m) return hhmm;
    const h = Number(m[1]);
    return String(h % 12 || 12).padStart(2, '0') + ':' + m[2] + ' ' + (h >= 12 ? 'PM' : 'AM');
  }

  // 'Martes, 15 de Septiembre de 2026'
  function tituloFecha(ymd) {
    const d = new Date(`${ymd}T12:00:00-06:00`);
    const parte = opciones => d.toLocaleDateString('es-MX', { ...opciones, timeZone: ZONA });
    return `${mayus(parte({ weekday: 'long' }))}, ${parte({ day: 'numeric' })} de ${mayus(parte({ month: 'long' }))} de ${parte({ year: 'numeric' })}`;
  }

  // ---------- Médicos ----------
  async function cargarMedicos() {
    const sel = document.getElementById('medicoSelect');
    try {
      const res = await fetch('/api/medicos');
      if (!res.ok) throw new Error();
      medicos = await res.json();
    } catch (e) {
      medicos = [];
    }

    if (medicos.length === 0) {
      sel.innerHTML = '<option value="">Sin médicos disponibles</option>';
      document.getElementById('timeGrid').innerHTML =
        '<div class="p-5 text-center text-muted">No se pudieron cargar los médicos del servidor.</div>';
      return;
    }

    sel.innerHTML = medicos.map(m => `<option value="${esc(m._id)}">${esc(m.nombre)}</option>`).join('');

    // Se recuerda el último médico elegido en este navegador
    let guardado = '';
    try { guardado = localStorage.getItem('medicoDashboard') || ''; } catch (e) {}
    medicoId = medicos.some(m => String(m._id) === guardado) ? guardado : String(medicos[0]._id);
    sel.value = medicoId;
    cambiarMedico();
  }

  function cambiarMedico() {
    medicoId = document.getElementById('medicoSelect').value;
    try { localStorage.setItem('medicoDashboard', medicoId); } catch (e) {}
    const medico = medicos.find(m => String(m._id) === medicoId);
    document.getElementById('medicoEspecialidad').textContent = medico ? medico.especialidad : '';
    cargarAgenda();
  }

  // ---------- Agenda del día ----------
  async function cargarAgenda() {
    const fecha = document.getElementById('agendaDate').value;
    if (!fecha || (!medicoId && !MOSTRAR_TODAS_LAS_CITAS)) return;

    const miCarga = ++numeroCarga;
    document.getElementById('selectedDateTitle').innerHTML =
      '<i class="far fa-calendar-alt mr-2"></i> ' + esc(tituloFecha(fecha));
    closeConsultation();

    const grid = document.getElementById('timeGrid');
    try {
      const filtroMedico = MOSTRAR_TODAS_LAS_CITAS ? '' : `medico_id=${encodeURIComponent(medicoId)}&`;
      const res = await fetch(`/api/agenda?${filtroMedico}fecha=${encodeURIComponent(fecha)}`);
      if (!res.ok) throw new Error();
      const datos = await res.json();
      if (miCarga !== numeroCarga) return;   // llegó tarde: ya se pidió otro día
      citasDia = datos;
      dibujarAgenda(fecha);
    } catch (e) {
      if (miCarga !== numeroCarga) return;
      citasDia = [];
      grid.innerHTML = '<div class="p-5 text-center text-danger"><i class="fas fa-exclamation-triangle mr-1"></i> No se pudo cargar la agenda. Revisa que el servidor esté encendido.</div>';
    }
  }

  function dibujarAgenda(fecha) {
    const diaPasado = fecha < hoyMX();
    const horas = [...new Set([...HORAS_BASE, ...citasDia.map(c => c.hora)])].sort();
    let html = '';

    if (citasDia.length === 0) {
      html += '<div class="p-3 bg-light border-bottom text-muted small"><i class="fas fa-info-circle mr-1"></i> No hay citas agendadas para este día.</div>';
    }

    horas.forEach(hora => {
      const cita = citasDia.find(c => c.hora === hora);
      const etiqueta = `<div class="time-label">${esc(hora12(hora))}</div>`;

      if (!cita) {
        html += `
          <div class="time-slot active-slot">
            ${etiqueta}
            <div class="slot-content bg-light">
              <span class="text-muted font-italic"><i class="far fa-clock mr-1"></i> Espacio libre disponible</span>
            </div>
          </div>`;
        return;
      }

      const nombre = (cita.paciente && cita.paciente.nombre) || 'Paciente sin nombre';
      const motivo = cita.motivo_consulta || 'Sin motivo registrado';
      const finalizada = cita.estado === 'completada';

      if (finalizada || diaPasado) {
        html += `
          <div class="time-slot past-slot">
            ${etiqueta}
            <div class="slot-content">
              <div>
                <h6 class="mb-1 font-weight-bold text-secondary">${esc(nombre)}</h6>
                <small class="text-muted"><i class="fas fa-file-medical mr-1"></i> ${esc(motivo)} • ${finalizada ? 'Concluido' : 'No atendida'}</small>
              </div>
              <div>
                <span class="badge badge-status px-3 py-2"><i class="fas fa-lock mr-1"></i> ${finalizada ? 'Finalizada' : 'No atendida'}</span>
              </div>
            </div>
          </div>`;
        return;
      }

      html += `
        <div class="time-slot active-slot" id="slot-${esc(cita._id)}">
          ${etiqueta}
          <div class="slot-content">
            <div>
              <h6 class="mb-1 font-weight-bold text-primary">${esc(nombre)}</h6>
              <small class="text-dark"><i class="fas fa-stethoscope mr-1"></i> Motivo: ${esc(motivo)}</small>
              ${MOSTRAR_TODAS_LAS_CITAS && cita.medico_nombre ? `<small class="d-block text-muted"><i class="fas fa-user-md mr-1"></i> ${esc(cita.medico_nombre)}</small>` : ''}
            </div>
            <div>
              <button class="btn btn-style-one btn-sm" data-cita="${esc(cita._id)}">
                <i class="fas fa-notes-medical mr-1"></i> Iniciar Consulta
              </button>
            </div>
          </div>
        </div>`;
    });

    document.getElementById('timeGrid').innerHTML = html;
  }

  // Cambiar de día con las flechas
  function cambiarDia(n) {
    const input = document.getElementById('agendaDate');
    if (!input.value) input.value = hoyMX();
    const d = new Date(`${input.value}T12:00:00-06:00`);
    d.setDate(d.getDate() + n);
    input.value = d.toLocaleDateString('en-CA', { timeZone: ZONA });
    cargarAgenda();
  }

  // Regresar a HOY
  function resetToday() {
    document.getElementById('agendaDate').value = hoyMX();
    cargarAgenda();
  }

  // ---------- Consulta (panel dividido) ----------
  function openConsultation(cita) {
    const p = cita.paciente || {};
    citaActiva = cita;

    document.getElementById('patientName').textContent = p.nombre || 'Paciente sin nombre';
    document.getElementById('patientMeta').textContent =
      (p.edad ? p.edad + ' años' : 'Edad no registrada') + ' | Expediente: ' + (p.expediente || 'sin expediente');
    document.getElementById('patientHistory').textContent = p.antecedentes || 'Sin antecedentes registrados';
    document.getElementById('patientReason').textContent = cita.motivo_consulta || 'Sin motivo registrado';

    if (activeSlotId && document.getElementById(activeSlotId)) {
      document.getElementById(activeSlotId).classList.remove('selected-slot');
    }
    activeSlotId = 'slot-' + cita._id;
    document.getElementById(activeSlotId).classList.add('selected-slot');

    document.getElementById('mensajeConsulta').className = '';
    document.getElementById('mensajeConsulta').textContent = '';

    document.getElementById('calendarColumn').className = 'col-lg-6';
    document.getElementById('consultationColumn').style.display = 'block';
    document.getElementById('consultationPanel').style.display = 'block';
  }

  function closeConsultation() {
    if (activeSlotId && document.getElementById(activeSlotId)) {
      document.getElementById(activeSlotId).classList.remove('selected-slot');
    }
    activeSlotId = null;
    citaActiva = null;
    document.getElementById('obsEvolucion').value = '';
    document.getElementById('prescripcion').value = '';
    document.getElementById('calendarColumn').className = 'col-lg-12';
    document.getElementById('consultationPanel').style.display = 'none';
  }

  // Finalizar consulta: se guarda en la base de datos
  async function finishConsultation(e) {
    e.preventDefault();
    if (!citaActiva) return;

    const boton = document.getElementById('btnFinalizar');
    const mensaje = document.getElementById('mensajeConsulta');
    boton.setAttribute('disabled', 'true');

    try {
      const res = await fetch(`/api/citas/${encodeURIComponent(citaActiva._id)}/finalizar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          medico_id: citaActiva.medico_id,
          observaciones: document.getElementById('obsEvolucion').value.trim(),
          prescripcion: document.getElementById('prescripcion').value.trim()
        })
      });
      const datos = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(datos.mensaje || 'No se pudo guardar la consulta.');

      await cargarAgenda();   // la cita pasa a "Finalizada"
    } catch (error) {
      mensaje.className = 'alert alert-danger py-2 small';
      mensaje.textContent = error instanceof TypeError
        ? 'No se pudo conectar con el servidor. Intenta de nuevo.'
        : error.message;
    } finally {
      boton.removeAttribute('disabled');
    }
  }

  window.onload = function() {
    document.getElementById('agendaDate').value = hoyMX();

    // Un solo "oyente" para los botones "Iniciar Consulta"
    document.getElementById('timeGrid').addEventListener('click', function(e) {
      const boton = e.target.closest('[data-cita]');
      if (!boton) return;
      const cita = citasDia.find(c => c._id === boton.dataset.cita);
      if (cita) openConsultation(cita);
    });

    if (MOSTRAR_TODAS_LAS_CITAS) {
      // Sin elegir médico: se muestran todas las citas
      document.getElementById('medicoSelect').style.display = 'none';
      document.getElementById('medicoEspecialidad').textContent = 'Todas las citas (modo prueba)';
      cargarAgenda();
      return;
    }

    cargarMedicos();
  };
</script>

</body>
</html>
